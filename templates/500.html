{% extends 'base.html' %}
{% block title %}500 — Error del Servidor{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fas fa-server fa-4x text-danger mb-4"></i>
    <h1 class="h2 text-gray-800 mb-2">500 — Error del Servidor</h1>
    <p class="text-muted mb-4">Ocurrió un error inesperado en el servidor. Por favor intenta más tarde o contacta a soporte si el problema persiste.</p>
    <div class="d-grid gap-2 d-md-flex justify-content-center">
        <a href="/" class="btn btn-primary">
            <i class="fas fa-home me-1"></i>Ir al inicio
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver atrás
        </a>
    </div>
</div>
{% endblock %}
