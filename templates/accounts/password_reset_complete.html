{% extends 'base.html' %}

{% block title %}Contraseña Restablecida{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-xl-5 col-lg-6 col-md-8">
        <div class="card o-hidden border-0 shadow-lg">
            <div class="card-body p-5 text-center">
                <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
                <h4 class="text-gray-900 mb-3">Contraseña Restablecida</h4>
                <p class="text-muted">Tu contraseña ha sido cambiada exitosamente.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
