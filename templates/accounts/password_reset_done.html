{% extends 'base.html' %}

{% block title %}Enlace Enviado{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-xl-5 col-lg-6 col-md-8">
        <div class="card o-hidden border-0 shadow-lg">
            <div class="card-body p-5 text-center">
                <i class="fas fa-envelope fa-4x text-primary mb-3"></i>
                <h4 class="text-gray-900 mb-3">Enlace Enviado</h4>
                <p class="text-muted">
                    Si la dirección de correo está registrada, recibirás un enlace para restablecer tu contraseña.
                    El enlace es válido por 24 horas.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                    <i class="fas fa-arrow-left me-2"></i>Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
